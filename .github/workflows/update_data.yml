name: Atualizar dados da planilha

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar e salvar dados
        run: |
          URL="https://script.google.com/macros/s/AKfycbxulZmSyj-JaRxaS1QV8m62wa3ouMRzGRCYW03ynYn6T_iXLr1elj0ikkbPKwct5QZ0/exec"
          curl -L --max-time 60 --retry 3 "$URL" -o data.json
          echo "Bytes: $(wc -c < data.json)"
          head -c 100 data.json
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Dados: $(date '+%d/%m/%Y %H:%M')"
          git push
